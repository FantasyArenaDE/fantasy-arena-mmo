<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Fantasy Arena MMO · Valhoria</title>
  <link rel="icon" href="../../build/icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="view.js" defer></script>
</head>
<body data-phase="check">
  <main class="forge">
    <div class="vista" aria-hidden="true">
      <img src="../../dist/fantasy-arena/portal-background.webp" alt="">
      <div class="orrery"><i></i><i></i><i></i><b></b></div>
    </div>
    <header class="masthead">
      <div class="identity">
        <img src="../../build/icon.png" alt="">
        <span>FANTASY ARENA <small>MMO</small></span>
      </div>
      <span class="world"><i></i> VALHORIA</span>
    </header>
    <div class="content">
      <img class="wordmark" src="../../dist/fantasy-arena/fa-forged-wordmark.webp" alt="Fantasy Arena">
      <p class="eyebrow"><span></span><span id="eyebrow">TORWACHE VON VALHORIA</span></p>
      <h1 id="headline">Das Tor<br>nach Valhoria</h1>
      <p class="intro" id="intro">Bevor sich das Tor öffnet, prüft die Torwache deinen Spielstand.</p>
      <section class="status" aria-label="Update" aria-live="polite">
        <div class="row"><strong id="status">Suche nach Updates</strong><span id="percent"></span></div>
        <progress id="progress" max="100" aria-label="Update"></progress>
        <div class="row sub"><span id="detail">Verbinde mit dem Update-Kanal …</span><span id="version"></span></div>
        <button type="button" id="retry" hidden>Erneut prüfen <span aria-hidden="true">↻</span></button>
      </section>
    </div>
    <footer><span>VALHORIA <i></i> FANTASY ARENA MMO</span><span id="footer">WINDOWS · X64</span></footer>
  </main>
</body>
</html>
